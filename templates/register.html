{% extends 'base.html' %}
{% block content %}
<h2>Регистрация</h2>
<form id="register-form">
    <div class="mb-3">
        <label for="reg-username" class="form-label">Имя пользователя</label>
        <input type="text" class="form-control" id="reg-username" required>
    </div>
    <div class="mb-3">
        <label for="reg-email" class="form-label">Email</label>
        <input type="email" class="form-control" id="reg-email" required>
    </div>
    <div class="mb-3">
        <label for="reg-password" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="reg-password" required minlength="8">
        <div class="form-text">Не менее 8 символов, хотя бы одна буква и одна цифра.</div>
    </div>
    <div class="mb-3">
        <label for="reg-password2" class="form-label">Подтверждение пароля</label>
        <input type="password" class="form-control" id="reg-password2" required>
    </div>
    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
    <p class="mt-2">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</form>
<div id="register-message" class="mt-3"></div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;

    const resp = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, email, password, password2 })
    });
    const data = await resp.json();
    const msgDiv = document.getElementById('register-message');

    if (resp.status === 201) {
        msgDiv.innerHTML = '<div class="alert alert-success">Регистрация успешна! <a href="/login/">Войти</a></div>';
    } else {
        let errors = '';
        for (const key in data) {
            errors += `<li>${key}: ${data[key]}</li>`;
        }
        msgDiv.innerHTML = `<div class="alert alert-danger"><ul>${errors}</ul></div>`;
    }
});
</script>
{% endblock %}
