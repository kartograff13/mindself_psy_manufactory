{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2 id="form-title">Создание урока</h2>
<form id="lesson-form">
    <div class="mb-3">
        <label for="title" class="form-label">Название</label>
        <input type="text" class="form-control" id="title" required>
    </div>
    <div class="mb-3">
        <label for="content" class="form-label">Контент (HTML)</label>
        <textarea class="form-control" id="content" rows="6"></textarea>
    </div>
    <div class="mb-3">
        <label for="video_url" class="form-label">Ссылка на видео</label>
        <input type="url" class="form-control" id="video_url">
    </div>
    <div class="mb-3">
        <label for="video_file" class="form-label">Видеофайл</label>
        <input type="file" class="form-control" id="video_file" accept="video/*">
    </div>
    <div class="mb-3">
        <label for="order" class="form-label">Порядковый номер</label>
        <input type="number" class="form-control" id="order" required>
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
</form>
<div id="form-message" class="mt-3"></div>

<script src="{% static 'js/api.js' %}"></script>
<script>
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login/';

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    // teacher/courses/{courseId}/lessons/{lessonId}/edit или .../create
    const courseId = pathParts[2];
    const isEdit = pathParts.length === 6 && pathParts[4] !== 'create';
    const lessonId = isEdit ? pathParts[4] : null;

    if (isEdit) {
        document.getElementById('form-title').textContent = 'Редактирование урока';
        fetch(`/api/lessons/${lessonId}/`, {headers: {'Authorization': 'Bearer ' + token}})
            .then(resp => resp.json())
            .then(data => {
                document.getElementById('title').value = data.title;
                document.getElementById('content').value = data.content || '';
                document.getElementById('video_url').value = data.video_url || '';
                document.getElementById('order').value = data.order;
            });
    }

    document.getElementById('lesson-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const videoFile = document.getElementById('video_file').files[0];
        const method = isEdit ? 'PATCH' : 'POST';
        const url = isEdit ? `/api/teacher/lessons/${lessonId}/` : '/api/teacher/lessons/';

        if (!videoFile) {
            // отправляем JSON
            const data = {
                course: courseId,
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                video_url: document.getElementById('video_url').value,
                order: document.getElementById('order').value
            };
            const resp = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(data)
            });
            if (resp.ok) window.location.href = `/teacher/courses/${courseId}/lessons/`;
            else {
                const err = await resp.json();
                document.getElementById('form-message').innerHTML = `<div class="alert alert-danger">${JSON.stringify(err)}</div>`;
            }
        } else {
            // отправляем FormData
            const formData = new FormData();
            formData.append('course', courseId);
            formData.append('title', document.getElementById('title').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('video_url', document.getElementById('video_url').value);
            formData.append('order', document.getElementById('order').value);
            formData.append('video_file', videoFile);

            const resp = await fetch(url, {
                method,
                headers: {'Authorization': 'Bearer ' + token},
                body: formData
            });
            if (resp.ok) window.location.href = `/teacher/courses/${courseId}/lessons/`;
            else {
                const err = await resp.json();
                document.getElementById('form-message').innerHTML = `<div class="alert alert-danger">${JSON.stringify(err)}</div>`;
            }
        }
    });
</script>
{% endblock %}
