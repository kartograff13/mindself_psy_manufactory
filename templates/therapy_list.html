{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Личная терапия</h2>
<div id="therapy-container" class="row mb-4"></div>

<!-- Форма заявки -->
<div class="card">
    <div class="card-body">
        <h5 class="card-title">Записаться на терапию</h5>
        <form id="request-form">
            <div class="mb-3">
                <label for="session-select" class="form-label">Выберите сессию</label>
                <select class="form-select" id="session-select" required></select>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Ваше имя</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="phone" required placeholder="+79991234567">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email (необязательно)</label>
                <input type="email" class="form-control" id="email">
            </div>
            <div class="mb-3">
                <label for="comment" class="form-label">Комментарий</label>
                <textarea class="form-control" id="comment" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Отправить заявку</button>
        </form>
        <div id="request-message" class="mt-3"></div>
    </div>
</div>

<script>
    const token = localStorage.getItem('access_token');

    async function loadTherapySessions() {
        const resp = await fetch('/api/therapy-sessions/');
        if (resp.status === 200) {
            const sessions = await resp.json();
            const select = document.getElementById('session-select');
            select.innerHTML = sessions.map(s => `<option value="${s.id}">${s.title} (${s.price} ₽)</option>`).join('');
            const container = document.getElementById('therapy-container');
            container.innerHTML = sessions.map(s => `
                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">${s.title}</h5>
                            <p class="card-text">${s.description || ''}</p>
                            <p class="card-text">
                                <strong>${s.price} ₽</strong><br>
                                <small class="text-muted">${new Date(s.start_datetime).toLocaleString('ru-RU')} — ${new Date(s.end_datetime).toLocaleString('ru-RU')}</small>
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    }

    document.getElementById('request-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            session: document.getElementById('session-select').value,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            comment: document.getElementById('comment').value
        };
        const headers = {'Content-Type': 'application/json'};
        if (token) headers['Authorization'] = 'Bearer ' + token;

        const resp = await fetch('/api/therapy-requests/', {
            method: 'POST',
            headers,
            body: JSON.stringify(data)
        });
        const result = await resp.json();
        const msgDiv = document.getElementById('request-message');
        if (resp.status === 201) {
            msgDiv.innerHTML = '<div class="alert alert-success">Заявка отправлена! Мы свяжемся с вами.</div>';
            document.getElementById('request-form').reset();
        } else {
            let errors = '';
            for (const key in result) errors += `<li>${key}: ${result[key]}</li>`;
            msgDiv.innerHTML = `<div class="alert alert-danger"><ul>${errors}</ul></div>`;
        }
    });

    // Предзаполнение для авторизованных
    async function prefillProfile() {
        if (token) {
            const resp = await fetch('/api/auth/profile/', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            if (resp.status === 200) {
                const profile = await resp.json();
                if (!document.getElementById('name').value) document.getElementById('name').value = profile.first_name && profile.last_name ? `${profile.first_name} ${profile.last_name}` : profile.username;
                if (!document.getElementById('phone').value) document.getElementById('phone').value = profile.phone || '';
                if (!document.getElementById('email').value) document.getElementById('email').value = profile.email || '';
            }
        }
    }

    loadTherapySessions();
    prefillProfile();
</script>
{% endblock %}
