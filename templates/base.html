{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindself Psy Manufactory</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">Mindself Psy Manufactory</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'courses_list' %}">Курсы</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'consultations_list' %}">Консультации</a></li>
                <li class="nav-item" id="login-link"><a class="nav-link" href="{% url 'login' %}">Войти</a></li>
                <li class="nav-item" id="profile-link" style="display:none;"><a class="nav-link" href="{% url 'profile' %}">Профиль</a></li>
                <li class="nav-item" id="logout-link" style="display:none;"><a class="nav-link" href="#" onclick="logout()">Выйти</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<footer class="mt-5 py-3 bg-light text-center">
    <p class="mb-0">© 2026 Mindself Psy Manufactory</p>
</footer>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'js/api.js' %}"></script>
<script>
    function updateNav() {
        const token = localStorage.getItem('access_token');
        if (token) {
            document.getElementById('login-link').style.display = 'none';
            document.getElementById('profile-link').style.display = 'block';
            document.getElementById('logout-link').style.display = 'block';
        } else {
            document.getElementById('login-link').style.display = 'block';
            document.getElementById('profile-link').style.display = 'none';
            document.getElementById('logout-link').style.display = 'none';
        }
    }

    function logout() {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '/';
    }

    updateNav();
</script>
</body>
</html>
