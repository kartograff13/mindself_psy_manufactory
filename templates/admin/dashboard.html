{% extends 'unfold/layouts/base.html' %}
{% block content %}
<div class="grid gap-4 lg:grid-cols-3">
    <div class="bg-white shadow rounded-lg p-6 lg:col-span-3">
        <h2 class="text-lg font-semibold mb-4">Статистика платформы</h2>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <p class="text-sm text-gray-500">Всего курсов</p>
                <p class="text-2xl font-bold">{{ total_courses }}</p>
            </div>
            <div>
                <p class="text-sm text-gray-500">Записей на курсы</p>
                <p class="text-2xl font-bold">{{ total_enrollments }}</p>
            </div>
            <div>
                <p class="text-sm text-gray-500">Новых заявок</p>
                <p class="text-2xl font-bold text-green-600">{{ new_requests }}</p>
            </div>
            <div>
                <p class="text-sm text-gray-500">Обработанных заявок</p>
                <p class="text-2xl font-bold text-blue-600">{{ processed_requests }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
