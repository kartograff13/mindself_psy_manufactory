{% extends 'base.html' %}
{% block content %}
<div id="course-detail"></div>
<div id="course-message"></div>

<script>
    const token = localStorage.getItem('access_token');
    const courseId = window.location.pathname.split('/').filter(Boolean).pop();

    async function loadCourse() {
        const headers = token ? {'Authorization': 'Bearer ' + token} : {};
        const resp = await fetch(`/api/courses/${courseId}/`, { headers });
        if (resp.status === 200) {
            const course = await resp.json();
            let html = `
                <h2>${course.title}</h2>
                <p>${course.description || ''}</p>
                <p><strong>Цена: ${course.price} ₽</strong></p>
                <p><em>Преподаватель: ${course.owner}</em></p>
                <h3 class="mt-4">Уроки</h3>
                <div class="list-group">
                    ${course.lessons.map(lesson => `
                        <a href="/lessons/${lesson.id}/" class="list-group-item list-group-item-action">
                            ${lesson.title} (порядок: ${lesson.order})
                        </a>
                    `).join('')}
                </div>
            `;
            document.getElementById('course-detail').innerHTML = html;

            if (token) {
                const enrollResp = await fetch('/api/enrollments/', {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                if (enrollResp.status === 200) {
                    const enrollments = await enrollResp.json();
                    const enrollment = enrollments.find(e => e.course === parseInt(courseId));
                    if (enrollment) {
                        // Уже записан – показываем кнопку отписки
                        document.getElementById('course-detail').innerHTML += `
                            <button class="btn btn-danger mt-3" onclick="unenroll(${enrollment.id})">Отписаться от курса</button>
                        `;
                    } else {
                        // Не записан – кнопка записи
                        document.getElementById('course-detail').innerHTML += `
                            <button class="btn btn-success mt-3" id="enroll-btn" onclick="enrollCourse()">Записаться на курс</button>
                        `;
                    }
                }
            } else {
                // Гость – кнопка записи с перенаправлением на вход
                document.getElementById('course-detail').innerHTML += `
                    <button class="btn btn-success mt-3" onclick="window.location.href='/login/'">Войти и записаться</button>
                `;
            }
        } else if (resp.status === 404) {
            document.getElementById('course-message').innerHTML = '<div class="alert alert-danger">Курс не найден</div>';
        } else {
            document.getElementById('course-message').innerHTML = '<div class="alert alert-danger">Ошибка загрузки</div>';
        }
    }

    async function enrollCourse() {
        if (!token) {
            alert('Необходимо войти');
            window.location.href = '/login/';
            return;
        }
        const resp = await fetch('/api/enrollments/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ course: parseInt(courseId) })
        });
        if (resp.status === 201) {
            alert('Вы успешно записаны на курс!');
            location.reload();
        } else {
            const err = await resp.json();
            alert('Ошибка: ' + JSON.stringify(err));
        }
    }

    async function unenroll(enrollmentId) {
        if (!token) return;
        if (!confirm('Вы уверены, что хотите отписаться от курса?')) return;
        const resp = await fetch(`/api/enrollments/${enrollmentId}/`, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (resp.status === 204) {
            alert('Вы отписались от курса.');
            location.reload();
        } else {
            alert('Ошибка при отписке.');
        }
    }

    loadCourse();
</script>
{% endblock %}
