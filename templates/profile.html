{% extends 'base.html' %}
{% block content %}
<div class="profile-container">
    <h2 class="mb-4">Личный кабинет</h2>
    <div id="profile-message"></div>

    <div class="row">
        <!-- Аватар и кнопки -->
        <div class="col-md-4 text-center mb-4">
            <div class="profile-avatar-wrapper" id="avatar-wrapper">
                <img id="avatar-img" src="" alt="Аватар" style="display: none;">
                <span id="avatar-placeholder" class="profile-avatar-placeholder"><i
                        class="bi bi-person-circle"></i></span>
            </div>
            <div class="mb-2">
                <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                <button class="btn btn-outline-primary btn-sm" id="upload-avatar-btn">Загрузить аватар</button>
            </div>
            <div>
                <button class="btn btn-outline-danger btn-sm" id="delete-avatar-btn" style="display: none;">Удалить
                    аватар
                </button>
            </div>
        </div>

        <!-- Форма профиля -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Профиль</h5>
                    <form id="profile-form">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="profile-username" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="profile-email" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Роль</label>
                            <input type="text" class="form-control" id="profile-role" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="profile-first-name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="profile-first-name">
                        </div>
                        <div class="mb-3">
                            <label for="profile-last-name" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="profile-last-name">
                        </div>
                        <div class="mb-3">
                            <label for="profile-phone" class="form-label">Телефон</label>
                            <input type="tel" class="form-control" id="profile-phone" placeholder="+79991234567">
                        </div>
                        <div class="mb-3">
                            <label for="profile-bio" class="form-label">О себе</label>
                            <textarea class="form-control" id="profile-bio" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </div>

            <!-- Смена пароля -->
            <div class="card mt-4">
                <div class="card-body">
                    <h5 class="card-title">Сменить пароль</h5>
                    <form id="password-form">
                        <div class="mb-3">
                            <label for="old-password" class="form-label">Старый пароль</label>
                            <input type="password" class="form-control" id="old-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="new-password" class="form-label">Новый пароль</label>
                            <input type="password" class="form-control" id="new-password" required minlength="8">
                        </div>
                        <div class="mb-3">
                            <label for="new-password2" class="form-label">Подтверждение нового пароля</label>
                            <input type="password" class="form-control" id="new-password2" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Сменить пароль</button>
                    </form>
                    <div id="password-message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('access_token');
    if (!token) {
        window.location.href = '/login/';
    }

    // Загрузка профиля и отображение аватара
    async function loadProfile() {
        const resp = await fetch('/api/auth/profile/', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (resp.status === 200) {
            const data = await resp.json();
            document.getElementById('profile-username').value = data.username;
            document.getElementById('profile-email').value = data.email;
            document.getElementById('profile-role').value = data.role;
            document.getElementById('profile-first-name').value = data.first_name || '';
            document.getElementById('profile-last-name').value = data.last_name || '';
            document.getElementById('profile-phone').value = data.phone || '';
            document.getElementById('profile-bio').value = data.bio || '';

            // Отображение аватара
            const avatarImg = document.getElementById('avatar-img');
            const placeholder = document.getElementById('avatar-placeholder');
            const deleteBtn = document.getElementById('delete-avatar-btn');
            if (data.avatar) {
                avatarImg.src = data.avatar;
                avatarImg.style.display = 'block';
                placeholder.style.display = 'none';
                deleteBtn.style.display = 'inline-block';
            } else {
                avatarImg.style.display = 'none';
                placeholder.style.display = 'flex';
                deleteBtn.style.display = 'none';
            }
        } else if (resp.status === 401) {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        }
    }

    // Сохранение профиля (без аватара)
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            first_name: document.getElementById('profile-first-name').value,
            last_name: document.getElementById('profile-last-name').value,
            phone: document.getElementById('profile-phone').value,
            bio: document.getElementById('profile-bio').value
        };
        const resp = await fetch('/api/auth/profile/', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
        });
        const msgDiv = document.getElementById('profile-message');
        if (resp.status === 200) {
            msgDiv.innerHTML = '<div class="alert alert-success">Профиль обновлён.</div>';
        } else {
            const err = await resp.json();
            msgDiv.innerHTML = `<div class="alert alert-danger">Ошибка: ${JSON.stringify(err)}</div>`;
        }
    });

    // Смена пароля
    document.getElementById('password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            old_password: document.getElementById('old-password').value,
            new_password: document.getElementById('new-password').value,
            new_password2: document.getElementById('new-password2').value
        };
        const resp = await fetch('/api/auth/profile/change-password/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
        });
        const msgDiv = document.getElementById('password-message');
        if (resp.status === 200) {
            msgDiv.innerHTML = '<div class="alert alert-success">Пароль изменён.</div>';
        } else {
            const err = await resp.json();
            msgDiv.innerHTML = `<div class="alert alert-danger">Ошибка: ${JSON.stringify(err)}</div>`;
        }
    });

    // Загрузка аватара
    document.getElementById('upload-avatar-btn').addEventListener('click', () => {
        document.getElementById('avatar-input').click();
    });

    document.getElementById('avatar-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Проверка размера на клиенте
        if (file.size > 2 * 1024 * 1024) {
            alert('Файл слишком большой. Максимальный размер: 2 МБ.');
            return;
        }

        // Проверка типа (MIME)
        if (!['image/jpeg', 'image/png'].includes(file.type)) {
            alert('Разрешены только JPEG и PNG.');
            return;
        }

        const formData = new FormData();
        formData.append('avatar', file);

        const resp = await fetch('/api/auth/profile/', {
            method: 'PATCH',
            headers: {
                'Authorization': 'Bearer ' + token
            },
            body: formData
        });
        if (resp.status === 200) {
            loadProfile();
        } else {
            const err = await resp.json();
            alert('Ошибка загрузки аватара: ' + JSON.stringify(err));
        }
    });

    // Удаление аватара
    document.getElementById('delete-avatar-btn').addEventListener('click', async () => {
        const resp = await fetch('/api/auth/profile/', {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({avatar: null})
        });
        if (resp.status === 200) {
            loadProfile();
        } else {
            const err = await resp.json();
            alert('Ошибка удаления аватара: ' + JSON.stringify(err));
        }
    });

    // Инициализация
    loadProfile();
</script>
{% endblock %}
